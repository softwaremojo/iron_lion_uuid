plugins:
  - rubocop-performance
  - rubocop-rake
  - rubocop-rspec

require:
  - ./rubocop/cop/iron_lion/raise_library_error

AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - lib/generators/**/templates/**/*
    - vendor/**/*

Style/StringLiterals:
  EnforcedStyle: double_quotes

# Write `offset: offset` where the shorthand `offset:` would hide what is passed.
Style/HashSyntax:
  EnforcedShorthandSyntax: either

Style/Documentation:
  Exclude:
    - spec/**/*

Layout/LineLength:
  Max: 120

Metrics/MethodLength:
  Max: 20

Metrics/AbcSize:
  Max: 25

Metrics/ModuleLength:
  Max: 175

Metrics/ClassLength:
  Max: 150

Metrics/BlockLength:
  Exclude:
    - spec/**/*

# Spec style: examples read as sentences about the library, not one class.
RSpec/DescribeClass:
  Enabled: false
RSpec/MultipleExpectations:
  Enabled: false
RSpec/ExampleLength:
  Max: 15
# RuboCop's own cop-spec helpers are expectations too.
RSpec:
  Language:
    Expectations:
      - expect_offense
      - expect_no_offenses
RSpec/NoExpectationExample:
  AllowedPatterns:
    - ^rejects
# One-line format declarations in specs read best as `a bits: 4; b bits: 4`.
Style/Semicolon:
  Exclude:
    - spec/**/*

# `rescue IronLion::Error` must catch every failure from the public API.
IronLion/RaiseLibraryError:
  Include:
    - lib/**/*.rb
  # These raise ArgumentError internally on purpose; Resolver converts it
  # into InvalidValueError at the public boundary.
  Exclude:
    - lib/iron_lion/base36.rb
    - lib/iron_lion/h3.rb
    - lib/iron_lion/geohash.rb
