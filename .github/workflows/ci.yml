name: CI

on:
  pull_request:
  # The main ruleset's merge queue requires `test` on each merge group.
  merge_group:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: iron_lion_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      IRON_LION_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/iron_lion_test
      IRON_LION_REQUIRE_DATABASE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - run: bundle exec rake
