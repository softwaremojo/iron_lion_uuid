name: CI

on:
  pull_request:
  # The main ruleset's merge queue requires `test` on each merge group.
  merge_group:
  push:
    branches: [main]

# The jobs only check out code and run the suite.
permissions:
  contents: read

jobs:
  suite:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every version iron_lion_uuid.gemspec's required_ruby_version allows.
        ruby: ["3.3", "3.4", "4.0"]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: iron_lion_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      IRON_LION_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/iron_lion_test
      IRON_LION_REQUIRE_DATABASE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@78c62f2208e480ce3d5ae4dfd9b9e181acf48b63 # v1.344.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake

  # The main ruleset requires a check named `test`. It passes only when the
  # suite passed on every Ruby in the matrix.
  test:
    needs: suite
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check every Ruby passed
        env:
          SUITE_RESULT: ${{ needs.suite.result }}
        run: |
          echo "suite: $SUITE_RESULT"
          test "$SUITE_RESULT" = success
